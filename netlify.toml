# Netlify Configuration for SE7EN Agency Website
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # No build command needed — static HTML
  publish = "."

# Production context
[context.production]
  environment = { NODE_ENV = "production" }

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# No catch-all redirect: this is a multi-page static site.
# Unknown URLs fall through to 404.html, which Netlify serves automatically.
