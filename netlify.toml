# Netlify Configuration for Yunus Seven's CV Website
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # No build command needed — static HTML
  publish = "."

# Node.js for the build, which the functions runtime follows: @netlify/blobs 11 needs Node 22.12+.
# 24 is the current LTS (22 reaches end of life in April 2027).
[build.environment]
  NODE_VERSION = "24"

# Production context
[context.production]
  environment = { NODE_ENV = "production" }

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The publish dir is the repo root, so stop project files that aren't part
# of the site (function and edge function source, npm files, project notes,
# this config) from being served as static files.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

# No catch-all redirect: this is a single-page static site.
# Unknown URLs fall through to 404.html, which Netlify serves automatically.
